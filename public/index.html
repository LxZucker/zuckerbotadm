
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Login | ZuckerBotADM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">

    <section id="login-screen" class="login-card">
      <div class="logo">
        <span class="logo-z">Z</span><span class="logo-b">B</span>
      </div>

      <p class="eyebrow">CENTRAL DE CONTROLE</p>
      <h1>ZuckerBot<span>ADM</span></h1>
      <p class="subtitle">Acesso restrito ao administrador</p>

      <form id="login-form">
        <label for="username">Usuário</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          placeholder="Seu usuário"
          required
        >

        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Sua senha"
          required
        >

        <p id="login-error" class="error"></p>

        <button id="login-button" type="submit">
          ENTRAR NO PAINEL
        </button>
      </form>

      <p class="security-note">
        ACESSO PROTEGIDO · ZUCKERBOTS
      </p>
    </section>

  </main>

  <script src="/admin.js"></script>
</body>
</html>
