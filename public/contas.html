
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Contas | ZuckerBotADM</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 0;
      background:
        radial-gradient(ellipse at top, rgba(255,40,50,.12), transparent 55%),
        #080808;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    .accounts-container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    .brand span:first-child { color: #ff303b; }
    .brand span:nth-child(2) { color: #19e68c; }

    .back-button {
      padding: 10px 12px;
      background: #202020;
      border: 1px solid #333;
      border-radius: 9px;
      color: white;
      font-size: 10px;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
    }

    .welcome {
      margin-bottom: 22px;
    }

    .eyebrow {
      color: #ff454f;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      margin: 0 0 9px;
    }

    h1 {
      font-size: clamp(26px, 6vw, 40px);
      line-height: 1.15;
      margin: 0 0 10px;
    }

    h1 span {
      color: #ff303b;
    }

    .welcome-description {
      color: #999;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
    }

    .panel-card {
      width: 100%;
      min-width: 0;
      padding: 18px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 15px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 17px;
      margin: 0;
    }

    .refresh-button {
      flex-shrink: 0;
      padding: 10px 12px;
      color: white;
      background: #202020;
      border: 1px solid #383838;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 900;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      padding: 0 12px;
      margin-bottom: 15px;
      background: #090909;
      border: 1px solid #333;
      border-radius: 10px;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      padding: 14px 0;
      color: white;
      background: transparent;
      border: 0;
      outline: none;
      font-size: 12px;
    }

    #accounts-message {
      color: #999;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .account-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2px 3px 5px 0;
    }

    .account-item {
      width: 100%;
      min-width: 0;
      padding: 16px;
      background: #090909;
      border: 1px solid #303030;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .account-item h3 {
      margin: 0 0 12px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .account-item p {
      margin: 8px 0;
      color: #aaa;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .account-state {
      display: inline-block;
      margin: 4px 0 8px;
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(25,230,140,.09);
      color: #19e68c;
      font-size: 10px;
      font-weight: 900;
    }

    .account-state.expired,
    .account-state.suspended {
      color: #ff747d;
      background: rgba(255,70,80,.10);
    }

    .account-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-top: 14px;
    }

    .account-tools input {
      width: 100%;
      min-width: 0;
      padding: 12px;
      color: white;
      background: #151515;
      border: 1px solid #393939;
      border-radius: 8px;
      font-size: 13px;
    }

    .account-item button {
      min-height: 42px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
    }

    .account-item button:disabled,
    .refresh-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .account-footer {
      padding: 20px 5px 8px;
      color: #555;
      text-align: center;
      font-size: 10px;
    }

    @media (max-width: 600px) {
      .accounts-container {
        padding: 10px;
      }

      .topbar {
        padding: 11px;
        margin-bottom: 23px;
      }

      .brand {
        font-size: 14px;
      }

      .back-button {
        padding: 10px;
        font-size: 9px;
      }

      .panel-card {
        padding: 13px;
      }

      .section-heading {
        align-items: center;
      }

      .account-item {
        padding: 13px;
      }

      .account-tools {
        grid-template-columns: 1fr;
      }

      .account-tools button {
        width: 100%;
      }
    }

    @media (max-width: 350px) {
      .brand {
        font-size: 12px;
      }

      .back-button {
        font-size: 8px;
        padding: 9px 7px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .refresh-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="accounts-container">

    <header class="topbar">
      <div class="brand">
        <span>Z</span><span>B</span> ZuckerBotADM
      </div>

      <a class="back-button" href="/admin.html">
        ← VOLTAR AO PAINEL
      </a>
    </header>

    <section class="welcome">
      <p class="eyebrow">GERENCIAMENTO DE CLIENTES</p>
      <h1>Contas <span>cadastradas.</span></h1>
      <p class="welcome-description">
        Consulte, pesquise e gerencie as contas dos usuários do ZuckerBots.
      </p>
    </section>

    <section class="panel-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">USUÁRIOS</p>
          <h2>Lista de contas</h2>
        </div>

        <button
          id="refresh-accounts"
          class="refresh-button"
          type="button"
        >
          ↻ ATUALIZAR
        </button>
      </div>

      <div class="search-box">
        <span>🔎</span>
        <input
          id="search-accounts"
          type="search"
          placeholder="Pesquisar usuário, login ou ID..."
        >
      </div>

      <p id="accounts-message">Preparando lista de contas...</p>

      <div id="accounts-list" class="account-list"></div>
    </section>

    <footer class="account-footer">
      ZuckerBotADM · GERENCIAMENTO DE CONTAS
    </footer>

  </main>

  <script src="/contas.js"></script>
</body>
</html>
